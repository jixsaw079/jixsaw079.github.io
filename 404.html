<title>404 — File Not Found | Jixsaw</title>

<style>.error-panel{min-height:65vh;display:flex;flex-direction:column;justify-content:center;max-width:760px}.error-code{font: .75rem var(--mono);letter-spacing:.12em;color:var(--accent)}.error-panel h1{font-size:clamp(4rem,13vw,8rem);margin:.8rem 0}.error-panel p{max-width:560px;color:var(--muted)}.error-actions{display:flex;flex-wrap:wrap;gap:1rem;margin-top:1rem}</style>
</head>
<body><main class="wrap error-panel"><span class="error-code">ERROR / 404 · RESOURCE NOT FOUND</span><h1>Lost in the<br><span class="accent">noise.</span></h1><p>The page you're looking for isn't at this address. The resource may have moved, or the URL may contain a typo.</p><div class="error-actions"><a class="button button-primary" href="/">Return home <span aria-hidden="true">↗</span></a><a class="text-link" href="/writeups/">Browse field notes <span aria-hidden="true">↗</span></a></div></main></body>
